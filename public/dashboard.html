<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude System — Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      font-size: 14px;
      padding: 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    h1 { font-size: 1.25rem; color: #f8fafc; }

    select {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .card-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .chart-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .chart-title {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .error { color: #f87171; font-size: 12px; margin-top: 0.5rem; }

    .sessions-section {
      margin-top: 1.5rem;
    }

    .sessions-title {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #0f172a;
    }

    th { color: #64748b; font-weight: 500; }
    td { color: #cbd5e1; }
    tr:hover td { background: #263348; }
    a.transcript-link { color: #3b82f6; text-decoration: none; }
    a.transcript-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Claude System — Dashboard</h1>
    <select id="days">
      <option value="7">7 jours</option>
      <option value="14">14 jours</option>
      <option value="30">30 jours</option>
    </select>
  </header>

  <div class="counters">
    <div class="card">
      <div class="card-label">Sessions aujourd'hui</div>
      <div class="card-value" id="cnt-sessions">—</div>
    </div>
    <div class="card">
      <div class="card-label">Tokens aujourd'hui</div>
      <div class="card-value" id="cnt-tokens">—</div>
    </div>
    <div class="card">
      <div class="card-label">Coût aujourd'hui (USD)</div>
      <div class="card-value" id="cnt-cost">—</div>
    </div>
    <div class="card">
      <div class="card-label">Qualité moy. prompts</div>
      <div class="card-value" id="cnt-quality">—</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <div class="chart-title">Coût USD / jour</div>
      <canvas id="chart-cost"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Cache hit rate / jour</div>
      <canvas id="chart-cache"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Ambiguity rate / jour</div>
      <canvas id="chart-ambiguity"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Qualité prompts / jour</div>
      <canvas id="chart-quality"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Top outils</div>
      <canvas id="chart-tools"></canvas>
    </div>
  </div>

  <div class="sessions-section">
    <div class="sessions-title">Sessions récentes</div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Modèle</th>
            <th>Prompts</th>
            <th>Score moy.</th>
            <th>Ambigus</th>
            <th>Source</th>
            <th>Transcript</th>
          </tr>
        </thead>
        <tbody id="sessions-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const charts = {}

    const chartDefaults = {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } },
      },
    }

    function fmt(n) { return n == null ? '—' : Number(n).toLocaleString('fr-FR') }
    function fmtUsd(n) { return n == null ? '—' : '$' + parseFloat(n).toFixed(4) }
    function fmtPct(n) { return n == null ? '—' : parseFloat(n).toFixed(1) + '%' }

    function makeOrUpdate(id, config) {
      if (charts[id]) {
        charts[id].data = config.data
        charts[id].update()
      } else {
        charts[id] = new Chart(document.getElementById(id), config)
      }
    }

    async function load(days) {
      const [kpisRes, toolsRes, promptsRes, sessionsRes] = await Promise.all([
        fetch(`/dashboard/kpis?days=${days}`),
        fetch(`/dashboard/tools?days=${days}`),
        fetch(`/dashboard/prompts?days=${days}`),
        fetch(`/dashboard/sessions?days=${days}`),
      ])
      const { rows: kpis } = await kpisRes.json()
      const { tools } = await toolsRes.json()
      const { rows: promptStats } = await promptsRes.json()
      const { sessions } = await sessionsRes.json()

      // Compteurs today
      const today = kpis.length ? kpis[kpis.length - 1] : null
      document.getElementById('cnt-sessions').textContent = today ? fmt(today.total_sessions) : '—'
      document.getElementById('cnt-tokens').textContent = today ? fmt(today.total_tokens) : '—'
      document.getElementById('cnt-cost').textContent = today ? fmtUsd(today.estimated_cost_usd) : '—'
      const todayPrompts = promptStats.length ? promptStats[promptStats.length - 1] : null
      document.getElementById('cnt-quality').textContent = todayPrompts?.avg_quality != null ? parseFloat(todayPrompts.avg_quality).toFixed(1) + ' / 10' : '—'

      const labels = kpis.map(r => r.snapshot_date?.slice(0, 10))

      makeOrUpdate('chart-cost', {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: kpis.map(r => parseFloat(r.estimated_cost_usd) || 0),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.08)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            ...chartDefaults.scales,
            y: { ...chartDefaults.scales.y, beginAtZero: true, title: { display: true, text: 'USD', color: '#64748b' } },
          },
        },
      })

      makeOrUpdate('chart-cache', {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: kpis.map(r => parseFloat(r.cache_hit_rate) || 0),
            borderColor: '#10b981',
            backgroundColor: 'rgba(16,185,129,0.08)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            ...chartDefaults.scales,
            y: { ...chartDefaults.scales.y, min: 0, max: 100, title: { display: true, text: '%', color: '#64748b' } },
          },
        },
      })

      makeOrUpdate('chart-ambiguity', {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: kpis.map(r => parseFloat(r.ambiguity_rate) || 0),
            borderColor: '#f59e0b',
            backgroundColor: 'rgba(245,158,11,0.08)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            ...chartDefaults.scales,
            y: { ...chartDefaults.scales.y, min: 0, max: 100, title: { display: true, text: '%', color: '#64748b' } },
          },
        },
      })

      const qualityLabels = promptStats.map(r => r.day?.slice(0, 10))
      makeOrUpdate('chart-quality', {
        type: 'line',
        data: {
          labels: qualityLabels,
          datasets: [{
            data: promptStats.map(r => r.avg_quality != null ? parseFloat(r.avg_quality) : null),
            borderColor: '#a855f7',
            backgroundColor: 'rgba(168,85,247,0.08)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
            spanGaps: true,
          }]
        },
        options: {
          ...chartDefaults,
          scales: {
            ...chartDefaults.scales,
            y: { ...chartDefaults.scales.y, min: 0, max: 10, title: { display: true, text: '/10', color: '#64748b' } },
          },
        },
      })

      makeOrUpdate('chart-tools', {
        type: 'bar',
        data: {
          labels: tools.map(t => t.tool_name),
          datasets: [{
            data: tools.map(t => parseInt(t.call_count) || 0),
            backgroundColor: '#6366f1',
          }]
        },
        options: {
          ...chartDefaults,
          indexAxis: 'y',
          scales: {
            x: { ...chartDefaults.scales.x, beginAtZero: true },
            y: { ...chartDefaults.scales.y },
          },
        },
      })

      // Sessions table
      const tbody = document.getElementById('sessions-tbody')
      tbody.innerHTML = sessions.map(s => {
        const date = new Date(s.started_at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })
        const model = s.model ? s.model.split('-').slice(-2).join('-') : '—'
        const score = s.avg_quality != null ? parseFloat(s.avg_quality).toFixed(1) + ' /10' : '—'
        const ambigus = parseInt(s.ambiguity_count) || 0
        const iaCount = parseInt(s.ambiguity_ia) || 0
        const heurCount = parseInt(s.ambiguity_heuristique) || 0
        const source = ambigus > 0 ? `${iaCount} IA / ${heurCount} h.` : '—'
        const link = s.transcript_path
          ? `<a class="transcript-link" href="/transcript?path=${encodeURIComponent(s.transcript_path)}" target="_blank">📄</a>`
          : '—'
        return `<tr><td>${date}</td><td>${model}</td><td>${parseInt(s.prompt_count) || 0}</td><td>${score}</td><td>${ambigus}</td><td>${source}</td><td>${link}</td></tr>`
      }).join('')
    }

    document.getElementById('days').addEventListener('change', e => load(e.target.value))
    load(7)
  </script>
</body>
</html>
